[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datamate"
version = "0.1.0"
description = "Zalo AI Challenge 2026 - DataMate offline agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb",
    "pandas",
    "openpyxl",
    "pydantic>=2",
    "pydantic-settings",
    "pyyaml",
    "httpx",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"
